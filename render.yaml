# Blueprint для Render (бесплатный план): https://render.com/deploy?repo=<url репозитория>
services:
  - type: web
    name: engine-portfolio
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: MPLCONFIGDIR
        value: /tmp/mpl
      - key: OUT_DIR
        value: /tmp/out
      - key: SCREW_PREFIX
        value: /screw
      - key: HYDRO_PREFIX
        value: /hydro
